<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Prof</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo">
          <img src="../assets/logo1.jpeg" alt="Attendly Logo">
        </div>
        <div class="brand-title">
          <h2>Attendly</h2>
          <p>Espace Professeur</p>
        </div>
      </div>
      <div class="avatar-icon" onclick="window.location.href='profile.html'" title="Profil">
        👨‍🏫
      </div>
    </div>

    <nav>
      <a href="emploi.html"><span class="icon"><i class="bi bi-calendar-week"></i></span>Emploi du temps</a>
      <a href="attendance.html"><span class="icon"><i class="bi bi-clipboard-check"></i></span>Génération QR Code</a>
      <a href="attendance-list.html"><span class="icon"><i class="bi bi-bar-chart"></i></span>Liste des présences</a>
      <a href="notes.html"><span class="icon"><i class="bi bi-grid-3x3"></i></span>Notes</a>
      <a href="profile.html" class="active"><span class="icon"><i class="bi bi-person"></i></span>Profil</a>
      <a href="parametres.html"><span class="icon"><i class="bi bi-gear"></i></span>Paramètres</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <h1>Profile</h1>
      <p>Informations personnelles et académiques</p>
    </div>

    <div class="content-card">
      <!-- Profile header -->
      <div class="profile-header">
        <img src="" alt="Avatar" class="avatar-lg" id="profileAvatar">
        <div class="profile-info">
          <h2 id="profileName">—</h2>
          <p id="profileDesc">—</p>
          <p style="margin-top:4px"><span class="badge blue" id="profileMatricule">Matricule : —</span></p>
        </div>
      </div>

      <!-- Info grid -->
      <div class="profile-grid">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" id="fieldNom" value="" placeholder="—" readonly>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="fieldEmail" value="" placeholder="—" readonly>
        </div>
        <div class="form-group">
          <label>Faculté</label>
          <input type="text" id="fieldFaculte" value="" placeholder="—" readonly>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- QR Modal -->
<div class="modal-overlay" id="qrModal">
  <div class="modal-box">
    <h3>Marquer la présence</h3>
    <p style="margin-bottom:12px;color:#64748b;font-size:0.88rem;">Entrez le code QR fourni par votre enseignant.</p>
    <div class="form-group">
      <input type="text" id="qrInput" placeholder="Code QR de la session">
    </div>
    <button class="btn-primary" onclick="submitQR()" style="width:100%;margin-bottom:12px;">Valider la présence</button>
    <p id="qrMessage" style="margin-bottom:12px;font-size:0.88rem;text-align:center;"></p>
    <button class="btn-close-modal" onclick="closeQR()">Fermer</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script type="module">
  import { getProfessorProfile, getCurrentUser } from '../js/database.js';
  
  // Load professor profile on page load
  document.addEventListener('DOMContentLoaded', async () => {
    const user = getCurrentUser();
    if (!user) {
      console.error('No user logged in');
      document.getElementById('profileName').textContent = 'Non connecté';
      return;
    }
    
    const result = await getProfessorProfile(user.id);
    
    if (result.success) {
      const prof = result.data;
      
      // Populate profile information
      document.getElementById('profileName').textContent = prof.full_name || 'N/A';
      document.getElementById('profileDesc').textContent = prof.department || 'Département non spécifié';
      document.getElementById('profileMatricule').textContent = 'CIN: ' + (prof.cin || 'N/A');
      
      document.getElementById('fieldNom').value = prof.full_name || '';
      document.getElementById('fieldEmail').value = prof.email || '';
      document.getElementById('fieldDept').value = prof.department || '';
      document.getElementById('fieldFaculte').value = 'Informatique'; // Default or from prof
      
      // Set avatar placeholder
      document.getElementById('profileAvatar').src = '../assets/default-avatar.png';
    } else {
      console.error('Error loading profile:', result.error);
      document.getElementById('profileName').textContent = 'Erreur de chargement';
    }
  });
</script>
</body>
</html>
